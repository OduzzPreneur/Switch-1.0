<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant Switch Orange Gradient -->
    <linearGradient id="switchOrangeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF7A29" />
      <stop offset="50%" stop-color="#FF5E14" />
      <stop offset="100%" stop-color="#E04200" />
    </linearGradient>

    <!-- Electric Cyan to Teal Accent Gradient -->
    <linearGradient id="switchCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Track Gradient for Dark & Light visibility -->
    <linearGradient id="switchTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#FF5E14" />
    </linearGradient>

    <!-- Subtle Orange Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#FF5E14" flood-opacity="0.4" />
    </filter>

    <!-- Subtle Container Depth -->
    <filter id="trackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Dynamic Outer Switch Loop Track -->
  <!-- Rounded stadium/pill geometry with dynamic transition arrow on the right -->
  <path
    d="M 42 16
       C 26 16 16 26 16 44
       L 16 76
       C 16 94 26 104 44 104
       L 76 104
       C 94 104 104 94 104 76
       L 104 46"
    stroke="url(#switchTrackGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#trackGlow)"
  />

  <!-- Dynamic Directional Arrowhead representing career switch & momentum -->
  <path
    d="M 94 56 L 104 44 L 114 56"
    fill="none"
    stroke="#38BDF8"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Dynamic Transformation Arc -->
  <path
    d="M 32 80 C 44 80 62 76 74 58"
    fill="none"
    stroke="url(#switchCyanGrad)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- The Core "Switch" Energy Toggle / Nucleus (Vibrant Orange Core) -->
  <rect
    x="38"
    y="30"
    width="44"
    height="36"
    rx="18"
    fill="url(#switchOrangeGrad)"
    filter="url(#orangeGlow)"
  />

  <!-- Subtle Inner Light Reflection on Core -->
  <ellipse
    cx="54"
    cy="40"
    rx="12"
    ry="6"
    fill="#FFFFFF"
    opacity="0.35"
  />
</svg>
